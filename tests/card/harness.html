<!doctype html>
<!-- Opus review of S2.1: hosts <floorplan-studio-card> so getComputedStyle sees a real Chromium cascade
     (FLOORPLAN_CSS, :host, prefers-color-scheme), not jsdom's, which does not compute CSS custom properties
     at all. Unlike dist/editor.html (built with vite:singlefile, so it is one inlined file), this card build
     is a separate dist/floorplan-studio-card.js; a plain <script src="..."> to it fails under file:// because
     Chromium refuses a cross-origin module fetch between two file:// URLs. tests/card/card.spec.ts injects the
     built module's own source into the page instead (page.addScriptTag({content, type:"module"})), which runs
     without a fetch. dist/ is rebuilt by tests/setup/build.ts. -->
<html>
<head><meta charset="utf-8"><script>
/* S25.8: the card's own default is `auto`, which hides idle devices at fit. Every card test that clicks a device at fit
   would then miss it, so this one place pins `detail: "full"` in the config unless the config names its own `detail`
   or the test sets window.__realDetailDefault (addInitScript) to see the real default. Nothing else is changed. */
customElements.whenDefined("floorplan-studio-card").then(() => {
  const P = customElements.get("floorplan-studio-card").prototype, orig = P.setConfig;
  P.setConfig = function (c) {
    if (window.__realDetailDefault || !c || typeof c !== "object" || "detail" in c) return orig.call(this, c);
    return orig.call(this, { ...c, detail: "full" });
  };
});
</script>
</head>
<body>
<!-- S8.2: an unstyled wrapper, not body itself, as the card's parent. :host is `height:100%` (so a fixed-height
     HA grid row is filled instead of cropped); CSS resolves a percentage height only against a parent that has
     one of its own, so with this wrapper (height auto, like every real ancestor div up to HA's own sized grid
     row or column) that degrades to the natural aspect-ratio height, same as before S8.2. Without it, a test
     that sets `document.body.style.height` for its own reasons (S7.15, to give the page room to scroll) would
     leak straight into the card and stretch the plan to fill the whole page instead. -->
<div id="wrap">
<floorplan-studio-card id="card"></floorplan-studio-card>
</div>
</body>
</html>
