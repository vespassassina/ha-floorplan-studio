<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floorplan Studio</title>
<style>html,body{margin:0;padding:8px 12px;background:#0d1522}</style>
</head>
<body>
<floorplan-studio-editor id="editor"></floorplan-studio-editor>
<script type="module">
  import fixture from "../../demo/layout.json";
  import home from "../../demo/home.json";
  import { restoreLayout } from "./state";
  import "./editor-app";

  const el = document.getElementById("editor");
  // The page behind the Studio takes the Studio's own background (--fp-bg of the theme on show), so a light Studio is not framed
  // in dark. The CSS above is only the colour before the Studio has drawn.
  const follow = () => {
    const bg = getComputedStyle(el).getPropertyValue("--fp-bg").trim();
    if (bg) document.documentElement.style.background = document.body.style.background = bg;
  };
  new MutationObserver(follow).observe(el, { attributes: true, attributeFilter: ["data-theme", "data-mode"] });
  follow();
  el.demo = home; // File, Load demo: the furnished house
  el.layout = restoreLayout() ?? fixture; // the page opens on the test fixture, which the specs pin
  // Standalone: the host of the element writes the file.
  el.addEventListener("save-request", (e) => {
    const blob = new Blob([JSON.stringify(e.detail, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "layout.json";
    a.click();
    URL.revokeObjectURL(a.href);
    el.saveDone(true);
  });
</script>
</body>
</html>
