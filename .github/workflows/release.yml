name: Release
# Push a tag like v0.1.0. The zip holds the integration with the built card, its 3D chunk, panel and editor in www/,
# which HACS downloads because hacs.json sets zip_release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: The tag must match manifest.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/floorplan_studio/manifest.json'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match manifest version v$v. Fix manifest.json, or retag."; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Zip
        run: |
          for f in floorplan-studio-card.js floorplan-studio-panel.js editor.html; do test -s custom_components/floorplan_studio/www/$f || { echo "missing www/$f: the build did not produce it"; exit 1; }; done
          # The 3D view is a lazy chunk beside the card (content-hashed name). Exactly one, or the card cannot load it.
          n=$(ls custom_components/floorplan_studio/www/floorplan-studio-3d-*.js 2>/dev/null | wc -l)
          [ "$n" -eq 1 ] || { echo "expected one www/floorplan-studio-3d-<hash>.js, found $n: the build did not produce it, or a stale one is left"; exit 1; }
          test -s custom_components/floorplan_studio/www/floorplan-studio-3d-*.js
          # The card's languages are lazy chunks too (src/card/i18n.ts LANGUAGES): exactly nine, or a language is missing or stale.
          n=$(ls custom_components/floorplan_studio/www/floorplan-studio-lang-*.js 2>/dev/null | wc -l)
          [ "$n" -eq 9 ] || { echo "expected nine www/floorplan-studio-lang-<code>-<hash>.js, found $n: the build did not produce them, or a stale one is left"; exit 1; }
          # The Edit-card form is a file of its own beside the card (S38.0, getConfigElement()): exactly one, or Edit card fails to open.
          n=$(ls custom_components/floorplan_studio/www/floorplan-studio-form-*.js 2>/dev/null | wc -l)
          [ "$n" -eq 1 ] || { echo "expected one www/floorplan-studio-form-<hash>.js, found $n: the build did not produce it, or a stale one is left"; exit 1; }
          cd custom_components/floorplan_studio && zip -r ../../floorplan_studio.zip . -x "__pycache__/*" "*.pyc"
      - name: Release, with the CHANGELOG entry as its notes
        # No section for the version (or an empty one): fall back to generated notes rather than fail the release.
        run: |
          if node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" floorplan_studio.zip --title "$GITHUB_REF_NAME" "${notes[@]}"
        env: { GH_TOKEN: "${{ github.token }}" }
